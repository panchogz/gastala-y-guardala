<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale=1, user-scalable=no: bloquea el pinch-zoom manual a propósito.
         Decisión consciente (trade-off de accesibilidad evaluado y aceptado) para
         evitar el auto-zoom de iOS Safari al enfocar inputs con font-size < 16px,
         sin tener que agrandar ningún input para cumplir ese umbral. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#14181D" />
    <style>
      /* Fondo oscuro inline, aplicado en el primer paint antes de que cargue
         el CSS externo — evita el destello blanco al reabrir la PWA
         instalada en iOS, donde reabrir desde el ícono suele implicar un
         proceso de WKWebView nuevo (parseo de HTML real) aunque no se vea
         la barra de Safari en modo standalone. */
      html, body { background: #14181D; }
    </style>
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />

    <!-- Splash screens para iOS (apple-touch-startup-image). Solo se leen al
         momento de instalar/agregar el ícono a la pantalla de inicio, no se
         actualizan solas: hay que reinstalar la PWA para verlas. -->
    <link rel="apple-touch-startup-image" href="/splash/iphone-se1-4in-640x1136.png"
      media="screen and (device-width: 320px) and (device-height: 568px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/iphone-se2-se3-8-750x1334.png"
      media="screen and (device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/iphone-8plus-1242x2208.png"
      media="screen and (device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/iphone-x-xs-11pro-1125x2436.png"
      media="screen and (device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/iphone-12mini-13mini-1080x2340.png"
      media="screen and (device-width: 360px) and (device-height: 780px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/iphone-xr-11-828x1792.png"

    <link rel="apple-touch-startup-image" href="/splash/iphone-14pro-15-15pro-16-1179x2556.png"
